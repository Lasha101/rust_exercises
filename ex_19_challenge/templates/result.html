{% if error.len() > 0 %}
<p style="color: #e74c3c; font-weight: bold; text-align: center;">{{ error }}</p>
{% endif %}

{% if result.len() > 0 %}
<div style="padding: 1rem 1.25rem; border-radius: 8px; border: 3px solid {{ color }}; background-color: {{ color }}18; text-align: center;">
    <p style="color: {{ color }}; font-size: 1.4rem; font-weight: bold; margin: 0;">{{ result }}</p>
</div>
{% endif %}
